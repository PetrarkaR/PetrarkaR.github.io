---
layout: default
title: Newsletter
---
<div class="newsletter-page newsletter-landing">
  <h1>{{ site.data.newsletter.name | escape }}</h1>
  {% if site.data.newsletter.signup_enabled %}
  <div class="newsletter-embed">{% include newsletter-form.html %}</div>
  <p class="newsletter-note">Occasional letters. Unsubscribe anytime.</p>
  {% else %}
  <p>Email signup is not open yet.</p>
  {% endif %}
  <p class="small"><a href="{{ '/newsletter/archive/' | relative_url }}">Past letters</a></p>
</div>
